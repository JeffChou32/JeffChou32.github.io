<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Asteroid Rush</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      #unity-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Asteroid Rush Github.loader.js";
      var config = {
        dataUrl: buildUrl + "/Asteroid Rush Github.data.unityweb",
        frameworkUrl: buildUrl + "/Asteroid Rush Github.framework.js.unityweb",
        codeUrl: buildUrl + "/Asteroid Rush Github.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Jeff Chou",
        productName: "Asteroid Rush",
        productVersion: "0.1",
      };

      var canvas = document.querySelector("#unity-canvas");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Optional: handle progress bar
        }).then((unityInstance) => {
          // Optional: handle fullscreen or other buttons
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
